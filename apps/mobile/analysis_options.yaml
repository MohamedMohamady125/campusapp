# Strict lints (spec §9.2): zero analyzer warnings in CI.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/api/**" # generated OpenAPI client

linter:
  rules:
    public_member_api_docs: false # app code, not a published package
